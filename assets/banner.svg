<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a1f36" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4" />
    </pattern>

    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 10px #00f2fe); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .radar-line {
      transform-origin: 1050px 200px;
      animation: radarScan 10s linear infinite;
    }
    .pulsing-dot {
      transform-origin: center;
      animation: pulseNode 3s ease-in-out infinite;
    }
    .floating-card {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 10 15;
      animation: dashStream 4s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#cyberGrid)" rx="16" />

  <!-- Dynamic / Animated Background Network Graph & Radar (Kept on background layer) -->
  <g opacity="0.35">
    <!-- Radar Sweep in Background Right -->
    <circle cx="1050" cy="200" r="140" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="1050" cy="200" r="90" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="1050" cy="200" r="40" fill="none" stroke="#334155" stroke-width="1" />
    <line class="radar-line" x1="1050" y1="200" x2="1190" y2="200" stroke="#00f2fe" stroke-width="2" opacity="0.7" />

    <!-- Connecting Cyber Mesh Lines -->
    <path d="M 100 80 L 250 140 L 450 60 L 700 120 L 950 80 L 1050 200" fill="none" stroke="#00f2fe" stroke-width="1.5" class="stream-line" opacity="0.5" />
    <path d="M 150 320 L 350 280 L 600 340 L 850 300 L 1050 200" fill="none" stroke="#7928ca" stroke-width="1.5" class="stream-line" opacity="0.5" />
  </g>

  <!-- Background Animated Tech Nodes -->
  <g opacity="0.6">
    <circle cx="250" cy="140" r="6" fill="#00f2fe" class="pulsing-dot" />
    <circle cx="450" cy="60" r="5" fill="#00ff88" class="pulsing-dot" />
    <circle cx="700" cy="120" r="7" fill="#38bdf8" class="pulsing-dot" />
    <circle cx="350" cy="280" r="6" fill="#a855f7" class="pulsing-dot" />
    <circle cx="850" cy="300" r="8" fill="#ec4899" class="pulsing-dot" />
  </g>

  <!-- Foreground Badge / Pill -->
  <g transform="translate(80, 65)">
    <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="17" r="6" fill="#00ff88" filter="url(#neonGlow)" />
    <text x="36" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">
      ⚡ AI-POWERED SOC DIRECTORY
    </text>
  </g>

  <!-- FOREGROUND TEXT CONTENT (Prominent, sharp, unhidden) -->
  <!-- Main Title -->
  <text x="80" y="155" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#neonGlow)">
    Awesome AI Security Assistant
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
    Curated SaaS &amp; Open-Source Directory for Agentic SOC &amp; Security Automation
  </text>

  <!-- Key Capabilities Pill Chips in Foreground -->
  <g transform="translate(80, 240)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="8" fill="#0f172a" stroke="#00f2fe" stroke-width="1" opacity="0.9" />
      <text x="16" y="24" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">🤖 Agentic Triage</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(195, 0)">
      <rect width="180" height="38" rx="8" fill="#0f172a" stroke="#00ff88" stroke-width="1" opacity="0.9" />
      <text x="16" y="24" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="600">🛡️ Threat Investigation</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(390, 0)">
      <rect width="190" height="38" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1" opacity="0.9" />
      <text x="16" y="24" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="600">⚡ Automated Response</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(595, 0)">
      <rect width="180" height="38" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1" opacity="0.9" />
      <text x="16" y="24" fill="#fb7185" font-family="sans-serif" font-size="13" font-weight="600">🌐 SOAR &amp; SIEM AI</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="80" y="325" width="1040" height="3" fill="url(#titleGradient)" rx="1.5" />
</svg>
